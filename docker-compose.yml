services:
  pg:
    container_name: tasknest-pg
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
      PG_DATA: /data/postgres
    ports:
      - "${DATABASE_PORT}:5432"

  api:
    container_name: tasknest-api
    build:
      context: .
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:${DATABASE_PORT}/${DATABASE_NAME}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_TOKEN_EXPIRE_MINUTES: ${JWT_TOKEN_EXPIRE_MINUTES}
    ports:
      - "${PORT}:3001"

networks:
  default:
    name: tasknest-network
    driver: bridge
