services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
      PG_DATA: /data/postgres
    ports:
      - "${DATABASE_PORT}:5432"
    restart: unless-stopped
    networks:
      - postgres

  tasknest:
    image: tasknest
    build:
      context: .
    ports:
      - "${PORT}:3000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${DATABASE_USER}:${DATABASE_PASS}@postgres:${DATABASE_PORT}/${DATABASE_NAME}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_TOKEN_EXPIRE_MINUTES: ${JWT_TOKEN_EXPIRE_MINUTES}
    networks:
      - postgres

networks:
  postgres:
    driver: bridge
