services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
      PG_DATA: /data/postgres
    ports:
      - "${DATABASE_PORT}:5432"
    restart: unless-stopped
    networks:
      - postgres

